<title>Personal Life Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   Personal Life Tracker, maquette Phase 0.
   Mise en page : panneau de contrôle (hors app) + cadre iPhone 390x844 mis à l'échelle ;
   sous 480px de large le cadre disparaît et l'app remplit l'écran.
   Identité : bleu de travail (accent), chiffres en mono comme un ticket de pointeuse,
   ruban horaire pour la journée. Tout le reste reste calme.
   ========================================================================== */

/* ---- 1. Tokens de l'app, générés depuis design/tokens.json (ne pas éditer ici) ---- */
/*THEME*/

/* ---- 2. Tokens de la PAGE autour du cadre (suit le thème de l'hôte, pas celui de l'app) ---- */
:root {
  --pg-bg: #E3E7EF; --pg-panel: #F4F6FA; --pg-fg: #101726; --pg-muted: #4A566C;
  --pg-line: #C9D0DD; --pg-accent: #2447B8; --pg-accent-on: #FFFFFF; --pg-fill: #D5DBE6;
  --pg-bezel: #0B0D12; --pg-bezel-edge: #3A4150; --pg-shadow: rgba(16, 23, 38, .22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pg-bg: #090C12; --pg-panel: #121823; --pg-fg: #EEF2FA; --pg-muted: #A9B4C9;
    --pg-line: #2A3345; --pg-accent: #93ABFF; --pg-accent-on: #0A1230; --pg-fill: #1F2838;
    --pg-bezel: #05060A; --pg-bezel-edge: #3A4150; --pg-shadow: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pg-bg: #090C12; --pg-panel: #121823; --pg-fg: #EEF2FA; --pg-muted: #A9B4C9;
  --pg-line: #2A3345; --pg-accent: #93ABFF; --pg-accent-on: #0A1230; --pg-fill: #1F2838;
  --pg-bezel: #05060A; --pg-bezel-edge: #3A4150; --pg-shadow: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---- 3. Page ---- */
html, body { height: 100%; }
body {
  background: var(--pg-bg); color: var(--pg-fg);
  font: 400 15px/1.45 var(--font-text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
.page { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; max-width: 1040px; margin: 0 auto; padding-block: 24px; align-items: start; }
.proto { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.proto-brand { display: flex; flex-direction: column; gap: 2px; }
.proto-brand strong { font: 700 20px/1.2 var(--font-text); letter-spacing: -.01em; }
.proto-brand span { color: var(--pg-muted); font-size: 13px; }
.proto-group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.proto-label { font: 600 11px/1.3 var(--font-text); letter-spacing: .08em; text-transform: uppercase; color: var(--pg-muted); }
.proto-seg { display: flex; gap: 2px; padding: 2px; border-radius: 11px; background: var(--pg-fill); }
.proto-seg button { flex: 1; min-width: 0; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--pg-fg); font: 500 14px/1 var(--font-text); cursor: pointer; padding: 0 6px; }
.proto-seg button .icon { display: none; width: 20px; height: 20px; }
.proto-seg button[aria-pressed="true"] { background: var(--pg-panel); font-weight: 600; box-shadow: 0 1px 3px var(--pg-shadow); }
.proto-select { display: none; width: 100%; min-height: 44px; border: 1px solid var(--pg-line); border-radius: 10px; background: var(--pg-panel); color: var(--pg-fg); font: 500 15px/1.2 var(--font-text); padding: 0 10px; }
.proto-list { display: flex; flex-direction: column; gap: 14px; }
.proto-list h3 { margin: 0 0 2px; font: 600 12px/1.3 var(--font-text); color: var(--pg-muted); }
.proto-list ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.proto-list button { width: 100%; min-height: 44px; display: flex; align-items: center; text-align: left; border: 0; border-radius: 8px; background: transparent; color: var(--pg-fg); font: 400 15px/1.2 var(--font-text); padding: 0 10px; cursor: pointer; }
@media (pointer: fine) { .proto-list button { min-height: 34px; } }
.proto-list button:hover { background: var(--pg-fill); }
.proto-list button[aria-current="true"] { background: var(--pg-accent); color: var(--pg-accent-on); font-weight: 600; }
.proto :focus-visible { outline: 2px solid var(--pg-accent); outline-offset: 2px; }
.proto-note { color: var(--pg-muted); font-size: 12px; margin: 0; }

.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); display: flex; justify-content: center; min-width: 0; }
.device-wrap { flex: none; }
.device { width: 414px; height: 868px; padding: 12px; border-radius: 62px; background: var(--pg-bezel); box-shadow: 0 0 0 1.5px var(--pg-bezel-edge), 0 30px 60px -20px var(--pg-shadow); transform-origin: 0 0; }
.device .app { width: 390px; height: 844px; border-radius: 50px; }

/* tablette / fenêtre étroite : contrôles compacts au-dessus du cadre */
@media (max-width: 899px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px; }
  .proto { flex-direction: row; flex-wrap: wrap; align-items: end; gap: 10px 12px; }
  .proto-brand, .proto-list, .proto-note { display: none; }
  .proto-group { flex: 1 1 160px; }
  .proto-select { display: block; }
  .proto-seg.is-states { display: none; }
  .stage { position: static; }
}
/* téléphone : plus de cadre, l'app remplit l'écran */
@media (max-width: 480px) {
  body { display: flex; flex-direction: column; overflow: hidden; }
  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 0; padding-block: 0; max-width: none; margin: 0; width: 100%; }
  .proto { flex: none; flex-wrap: nowrap; gap: 8px; padding-block: 6px; align-items: center; }
  .proto-label { display: none; }
  .proto-group { flex: 1 1 0; }
  .proto-group.is-theme { flex: 0 0 136px; }
  .proto-seg button .long { display: none; }
  .proto-seg button .icon { display: block; margin: 0 auto; }
  .stage { flex: 1; min-height: 0; display: flex; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
  .device-wrap { flex: 1; min-width: 0; width: auto !important; height: auto !important; display: flex; }
  .device { flex: 1; min-width: 0; width: auto; height: auto; padding: 0; border-radius: 0; box-shadow: none; transform: none !important; display: flex; }
  .device .app { flex: 1; min-width: 0; width: auto; height: auto; border-radius: 0; --sb-h: 8px; --tab-h: 58px; --home-h: 0px; }
  .device .statusbar, .device .island, .device .homebar { display: none; }
}

/* ==========================================================================
   4. APP : tout ce qui suit vit dans .app et n'utilise que les tokens du thème
   ========================================================================== */
.app {
  --sb-h: 54px; --tab-h: 83px; --home-h: 34px; --gutter: 16px;
  position: relative; overflow: hidden; overflow: clip; isolation: isolate;
  background: var(--background); color: var(--textPrimary);
  font: var(--t-body) var(--font-text); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; color-scheme: light;
}
.app[data-theme="dark"], .app[data-theme="amoled"] { color-scheme: dark; }
:where(.app) :where(button, input, select, textarea) { font: inherit; color: inherit; letter-spacing: inherit; }
.app button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.app :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
:where(.app) :where(h1, h2, h3, p) { margin: 0; }
:where(.app) a { color: var(--accent); }
[hidden] { display: none !important; }

/* chiffres : .num partout où une heure, une durée ou un montant s'affiche */
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; word-spacing: -.32em; }
.icon { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon--s { width: 18px; height: 18px; stroke-width: 2; }
.icon--l { width: 32px; height: 32px; stroke-width: 1.6; }
.muted { color: var(--textSecondary); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- chrome iPhone ---- */
.statusbar { position: absolute; inset: 0 0 auto; height: var(--sb-h); z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 38px; font: 600 16px/1 var(--font-text); background: var(--background); color: var(--textPrimary); }
.statusbar-right { display: flex; align-items: center; gap: 6px; }
.statusbar svg { height: 12px; width: auto; fill: currentColor; }
.island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: var(--pg-bezel); z-index: 31; }
.homebar { position: absolute; left: 50%; bottom: 8px; width: 138px; height: 5px; margin-left: -69px; border-radius: 3px; background: var(--textPrimary); z-index: 60; pointer-events: none; }
.app.is-fullbleed .statusbar { background: transparent; }

/* ---- écrans ---- */
.screens { position: absolute; inset: var(--sb-h) 0 0; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(var(--tab-h) + 8px); scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.screen > * { flex-shrink: 0; }
.screen.is-active { display: flex; animation: screen-in var(--motion-normal) var(--ease); }
.app.no-tabbar .screen { padding-bottom: calc(var(--home-h) + 8px); }
.screen[data-fullbleed] { top: calc(-1 * var(--sb-h)); padding-top: var(--sb-h); }
@keyframes screen-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.screen-body { display: flex; flex-direction: column; gap: var(--space-l); padding: var(--space-s) var(--gutter) var(--space-l); min-width: 0; }

/* ---- barre de navigation et grand titre ---- */
.navbar { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; padding: 0 8px; background: var(--background); }
.navbar-title { font: var(--t-headline) var(--font-text); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; grid-column: 2; }
.navbar-back { justify-self: start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 0; border: 0; background: none; color: var(--accent); font-size: 17px; }
.navbar-actions { grid-column: 3; justify-self: end; display: flex; align-items: center; }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: var(--accent); }
.iconbtn--tonal { width: 36px; height: 36px; margin: 4px; background: var(--fill); color: var(--textPrimary); position: relative; }
.iconbtn--tonal::before { content: ""; position: absolute; inset: -4px; }
.largetitle { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 4px var(--gutter) 8px; }
.largetitle h1 { font: var(--t-largeTitle) var(--font-text); letter-spacing: -.025em; text-wrap: balance; }
.eyebrow { font: 600 12px/16px var(--font-text); letter-spacing: .07em; text-transform: uppercase; color: var(--textSecondary); }

/* ---- sections ---- */
.section { display: flex; flex-direction: column; gap: var(--space-s); min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
.section-title { font: var(--t-title3) var(--font-text); letter-spacing: -.02em; }
.section-link { border: 0; background: none; color: var(--accent); font-size: 15px; min-height: 44px; margin: -12px 0; padding: 0 4px; }
.section-foot { padding: 0 4px; font: var(--t-footnote) var(--font-text); color: var(--textSecondary); }

/* ---- carte ---- */
.card { display: flex; flex-direction: column; gap: 12px; padding: var(--space-m); border-radius: var(--radius-large); background: var(--surface); box-shadow: var(--shadow-card); min-width: 0; }
.card--outline { background: none; box-shadow: none; border: 1px solid var(--separator); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title { font: var(--t-title2) var(--font-text); letter-spacing: -.02em; text-wrap: balance; }
.card-text { font: var(--t-subhead) var(--font-text); color: var(--textSecondary); }
/* carte Maintenant : le seul aplat d'accent de l'app, une seule par écran */
.card--now { background: var(--accent); color: var(--accentOn); box-shadow: var(--shadow-float); gap: 14px; }
.card--now .eyebrow, .card--now .card-text { color: inherit; opacity: .84; }
.card--now .btn--primary { background: var(--accentOn); color: var(--accent); }
.card--now .btn--secondary { background: color-mix(in srgb, var(--accentOn) 16%, transparent); color: var(--accentOn); }
.card--now .btn--ghost { color: var(--accentOn); text-decoration: underline; text-underline-offset: 3px; }
.card--now :focus-visible { outline-color: var(--accentOn); }
.card--now.is-calm { background: var(--surface); color: var(--textPrimary); box-shadow: var(--shadow-card); }
.card--now.is-calm .btn--ghost { color: var(--accent); }
.card--now.is-calm .eyebrow, .card--now.is-calm .card-text { color: var(--textSecondary); opacity: 1; }

/* ---- liste groupée et lignes ---- */
.list { display: flex; flex-direction: column; border-radius: var(--radius-medium); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 9px var(--space-m); border: 0; background: none; text-align: left; position: relative; text-decoration: none; color: var(--textPrimary); }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--space-m); height: 1px; background: var(--separator); }
.row:has(> .row-icon) + .row:has(> .row-icon)::before { left: 60px; }
button.row:active, a.row:active { background: var(--fill); }
.row-icon { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: var(--radius-small); background: var(--fill); color: var(--textPrimary); }
.row-icon .icon { width: 19px; height: 19px; }
.row-icon--work { background: var(--workSoft); color: var(--work); }
.row-icon--study { background: var(--studySoft); color: var(--study); }
.row-icon--errand { background: var(--errandSoft); color: var(--errand); }
.row-icon--accent { background: var(--accentSoft); color: var(--accent); }
.row-icon--danger { background: var(--dangerSoft); color: var(--danger); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-title { font: var(--t-body) var(--font-text); }
.row-sub { font: var(--t-footnote) var(--font-text); color: var(--textSecondary); }
.row-value { flex: none; max-width: 50%; text-align: right; font-size: 16px; color: var(--textSecondary); }
.row-chev { flex: none; width: 16px; height: 16px; color: var(--textTertiary); stroke-width: 2.4; }
.row--destructive .row-title { color: var(--danger); }
.row-check { flex: none; color: var(--accent); opacity: 0; }
.row[aria-checked="true"] .row-check { opacity: 1; }
.app[data-density="compact"] .row { min-height: 44px; padding-block: 5px; }
.app[data-density="compact"] .screen-body { gap: var(--space-m); }

/* ---- pastilles ---- */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: var(--radius-pill); font: 600 13px/1 var(--font-text); white-space: nowrap; background: var(--fill); color: var(--textPrimary); }
.chip .icon { width: 14px; height: 14px; stroke-width: 2.2; }
.chip--work { background: var(--workSoft); color: var(--work); }
.chip--study { background: var(--studySoft); color: var(--study); }
.chip--errand { background: var(--errandSoft); color: var(--errand); }
.chip--accent { background: var(--accentSoft); color: var(--accent); }
.chip--danger { background: var(--dangerSoft); color: var(--danger); }
.chip--doubt { background: none; color: var(--textSecondary); border: 1.5px dashed var(--textTertiary); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---- boutons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border: 0; border-radius: var(--radius-medium); font: 600 17px/1.15 var(--font-text); text-align: center; text-decoration: none; transition: transform var(--motion-fast) var(--ease), opacity var(--motion-fast); }
.btn:active { transform: scale(.98); opacity: .85; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn--primary { background: var(--accent); color: var(--accentOn); }
.btn--secondary { background: var(--fill); color: var(--textPrimary); }
.btn--destructive { background: var(--danger); color: var(--dangerOn); }
.btn--destructive-soft { background: var(--dangerSoft); color: var(--danger); }
.btn--ghost { background: none; color: var(--accent); min-height: 44px; padding: 0 8px; font-weight: 500; font-size: 15px; }
.btn--small { min-height: 44px; padding: 0 14px; font-size: 15px; border-radius: 12px; }
.btn--block { display: flex; width: 100%; }
.btn-row { display: flex; gap: 8px; }
.btn-row > .btn { flex: 1; min-width: 0; padding-inline: 10px; }
.btn-row--links { justify-content: space-between; margin: -8px -8px -10px; }
.btn-row--links > .btn { flex: none; }
.btn-stack { display: flex; flex-direction: column; gap: 8px; }
.fab-dock { position: sticky; bottom: calc(var(--tab-h) + 16px); height: 0; margin-top: auto; z-index: 15; }
.app.no-tabbar .fab-dock { bottom: calc(var(--home-h) + 16px); }
.fab { position: absolute; right: var(--gutter); bottom: 0; display: grid; place-items: center; width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--accent); color: var(--accentOn); box-shadow: var(--shadow-float); }
.fab .icon { width: 28px; height: 28px; stroke-width: 2.2; }

/* ---- interrupteur ---- */
.switch { flex: none; position: relative; width: 51px; height: 31px; padding: 0; border: 0; border-radius: 16px; background: color-mix(in srgb, var(--textTertiary) 42%, var(--fill)); transition: background var(--motion-fast); }
.switch::before { content: ""; position: absolute; inset: -7px -4px; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform var(--motion-normal) var(--ease); }
.app[data-theme="dark"] .switch::after, .app[data-theme="amoled"] .switch::after { background: var(--textPrimary); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--accentOn) !important; }

/* ---- contrôle segmenté ---- */
.segmented { display: flex; gap: 2px; padding: 2px; min-height: 44px; border-radius: 11px; background: var(--fill); }
.segmented > button { flex: 1; min-width: 0; padding: 0 4px; border: 0; border-radius: 9px; background: none; font: 500 14px/1.1 var(--font-text); color: var(--textPrimary); transition: background var(--motion-fast); }
.segmented > button[aria-pressed="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.app[data-theme="dark"] .segmented > button[aria-pressed="true"], .app[data-theme="amoled"] .segmented > button[aria-pressed="true"] { background: color-mix(in srgb, var(--textTertiary) 45%, var(--fill)); }

/* ---- champs ---- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font: 600 13px/18px var(--font-text); color: var(--textSecondary); padding: 0 4px; }
.input { width: 100%; min-height: 50px; padding: 0 14px; border: 1px solid var(--separator); border-radius: var(--radius-medium); background: var(--surface); color: var(--textPrimary); font-size: 17px; }
.input::placeholder { color: var(--textTertiary); opacity: 1; }
.input:focus-visible { outline-offset: 0; border-color: var(--accent); }
.field-help { font: var(--t-footnote) var(--font-text); color: var(--textSecondary); padding: 0 4px; }
.field.is-invalid .input { border-color: var(--danger); }
.field.is-invalid .field-help { color: var(--danger); }

/* ---- pastilles de couleur ---- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
.swatch { width: 100%; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; }
.swatch::before { content: ""; width: 30px; height: 30px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--surface), 0 0 0 0 var(--c); transition: box-shadow var(--motion-fast); }
.swatch[aria-pressed="true"]::before { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5.5px var(--c); }

/* ---- feuille (bottom sheet) ---- */
.overlay-host { position: absolute; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; overflow: clip; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(4, 8, 16, .5); opacity: 0; transition: opacity var(--motion-normal); }
.overlay-host.has-sheet { pointer-events: auto; }
.overlay-host.has-sheet .sheet-backdrop { opacity: 1; }
.sheet { position: absolute; inset: auto 0 0; max-height: 88%; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 8px var(--gutter) calc(var(--home-h) + 16px); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; background: var(--surfaceRaised); box-shadow: var(--shadow-sheet); transform: translateY(105%); visibility: hidden; transition: transform var(--motion-slow) var(--ease-sheet), visibility 0s var(--motion-slow); }
.app[data-theme="amoled"] .sheet { border-top: 1px solid var(--separator); }
.sheet.is-open { transform: none; visibility: visible; transition-delay: 0s; }
.sheet:focus { outline: none; }
.sheet-grabber { align-self: center; flex: none; width: 36px; height: 5px; border-radius: 3px; background: var(--separator); }
