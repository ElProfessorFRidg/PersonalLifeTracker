name: build-test (réutilisable)
on:
  workflow_call:
    inputs:
      build_ipa:
        type: boolean
        default: false
      version:
        description: "x.y.z (sans suffixe) pour Info.plist"
        type: string
        default: "0.0.0"
permissions:
  contents: read
jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Garde-fous honnêteté (scripts Python)
        run: |
          python3 scripts/check_tests_integrity.py
          python3 scripts/check_progress.py
          python3 scripts/validate_altstore_source.py --self-test
      - name: Choisir le Xcode le plus récent installé
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Xcode choisi: $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet
        run: xcodegen generate
      - name: Tests (simulateur)
        run: |
          UDID=$(scripts/pick_simulator.sh)
          set -o pipefail
          xcodebuild test -project PersonalLifeTracker.xcodeproj -scheme PersonalLifeTracker \
            -destination "id=$UDID" -resultBundlePath build/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tail -80
      - name: Résumé des tests (réel, depuis xcresult)
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path build/tests.xcresult 2>/dev/null | head -60 || echo "xcresult absent"
      - name: Envoyer le xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-xcresult
          path: build/tests.xcresult
          if-no-files-found: ignore
      - name: Build IPA non signé
        if: inputs.build_ipa
        run: scripts/build_ipa.sh "${{ inputs.version }}" "${{ github.run_number }}" PersonalLifeTracker.ipa
      - name: Envoyer l'IPA
        if: inputs.build_ipa
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: PersonalLifeTracker.ipa
          if-no-files-found: error
