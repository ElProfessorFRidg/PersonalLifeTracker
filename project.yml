name: PersonalLifeTracker
options:
  bundleIdPrefix: com.CHANGEME
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PersonalLifeTracker:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.CHANGEME.personallifetracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Life Tracker"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Pour détecter quand tu arrives au travail ou en cours."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Pour détecter ton arrivée et ton départ même quand l'app est fermée."
  UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/UnitTests]
    resources:
      - path: spec/oracles.json
    dependencies:
      - target: PersonalLifeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.CHANGEME.personallifetracker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PersonalLifeTracker:
    build:
      targets:
        PersonalLifeTracker: all
    test:
      targets: [UnitTests]
